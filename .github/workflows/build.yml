name: Pars Ping APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Print Build Errors
        if: steps.build.outcome == 'failure'
        run: |
          grep -n -B 8 -A 15 -E \
            "What went wrong|Caused by:|Execution failed|Could not resolve|error:" \
            build.log | tail -n 120 || tail -n 120 build.log

      - name: Stop if Build Failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Check APK Exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Check APK Structure
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pars-Ping-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
